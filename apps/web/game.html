<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Royal Fiesta</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1b0f2e; }
      /* #views holds the game canvas(es): local play mounts one canvas split into seats (S26), while the
         client page keeps one canvas per client; the grid columns and rows are set from that count. */
      #views { position: fixed; inset: 0; display: grid; }
      #views canvas { width: 100%; height: 100%; min-width: 0; min-height: 0; display: block; }
      /* canvas#ui (the uaa screens and HUD, styled by uaaHost.ts) sits over the views; the game takes clicks on menus only. */
      #screens { position: fixed; inset: 0; pointer-events: none; }
      /* The touch controls (S26) cover the game only while it owns the pointer: hidden on the menus. */
      #touch { position: fixed; inset: 0; z-index: 5; pointer-events: none; }
      #touch[hidden] { display: none; }
      #touch canvas { display: block; width: 100%; height: 100%; }
      /* The controller remap draws on its own canvas over #screens; the empty root must not eat clicks. */
      #remap { position: fixed; inset: 0; z-index: 20; pointer-events: none; }
      /* Settings' entry point to the remap: bottom centre, in the game's colours, hidden on other screens. */
      #open-remap { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 5; border: 0; border-radius: 999px; padding: 12px 22px; background: #ff77c8; color: #fff; font: 700 18px system-ui, sans-serif; cursor: pointer; }
      #open-remap[hidden] { display: none; }
      /* Community levels (docs/community-levels.md): only mounted when the page has a levels base URL. */
      #open-community { position: fixed; right: 24px; bottom: 24px; z-index: 5; border: 0; border-radius: 999px; padding: 12px 22px; background: #5fd0ff; color: #12203a; font: 700 18px system-ui, sans-serif; cursor: pointer; }
      #open-community[hidden] { display: none; }
      #community-panel { position: fixed; right: 24px; bottom: 84px; z-index: 6; width: min(420px, 90vw); max-height: 60vh; overflow: auto; padding: 16px; border-radius: 16px; background: #2a1a47; color: #fff; font: 16px system-ui, sans-serif; }
      #community-panel[hidden] { display: none; }
      #community-panel ul { list-style: none; margin: 8px 0; padding: 0; display: grid; gap: 8px; }
      #community-panel li { display: flex; gap: 10px; align-items: center; }
      #community-panel button { border: 0; border-radius: 999px; padding: 6px 14px; background: #ff77c8; color: #fff; font: 700 15px system-ui, sans-serif; cursor: pointer; }
      #round-loading { position: fixed; inset: 0; z-index: 10; display: grid; place-content: center; gap: 20px; text-align: center; background: #1b0f2e; color: #fff; font: 700 22px system-ui, sans-serif; }
      #round-loading[hidden] { display: none; }
      #round-loading progress { width: 320px; max-width: 80vw; accent-color: #ff77c8; }
    </style>
  </head>
  <body>
    <main id="views"></main>
    <div id="screens"><canvas id="ui"></canvas></div>
    <div id="touch" hidden></div>
    <div id="remap"></div>
    <button id="open-remap" type="button" hidden>Controller...</button>
    <button id="open-community" type="button" hidden>Community levels</button>
    <aside id="community-panel" hidden></aside>
    <script type="module" src="/src/game/main.ts"></script>
    <aside id="round-loading" role="status" aria-live="polite"><strong>Royal Fiesta</strong><span data-label>Starting...</span><progress aria-label="Loading progress"></progress></aside>
  </body>
</html>
