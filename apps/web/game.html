<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Royal Fiesta</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1b0f2e; }
      /* One canvas per client (client/canvases.ts): the grid columns and rows are set from the client count. */
      #views { position: fixed; inset: 0; display: grid; }
      #views canvas { width: 100%; height: 100%; min-width: 0; min-height: 0; display: block; }
      /* canvas#ui (the uaa screens and HUD, styled by uaaHost.ts) sits over the views; the game takes clicks on menus only. */
      #screens { position: fixed; inset: 0; pointer-events: none; }
      #round-loading { position: fixed; inset: 0; z-index: 10; display: grid; place-content: center; gap: 20px; text-align: center; background: #1b0f2e; color: #fff; font: 700 22px system-ui, sans-serif; }
      #round-loading[hidden] { display: none; }
      #round-loading progress { width: 320px; max-width: 80vw; accent-color: #ff77c8; }
    </style>
  </head>
  <body>
    <main id="views"></main>
    <div id="screens"><canvas id="ui"></canvas></div>
    <script type="module" src="/src/game/main.ts"></script>
    <aside id="round-loading" role="status" aria-live="polite"><strong>Royal Fiesta</strong><span data-label>Starting...</span><progress aria-label="Loading progress"></progress></aside>
  </body>
</html>
