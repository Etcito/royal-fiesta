<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Royal Fiesta - Hub</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1b0f2e; }
      /* One canvas per client (client/canvases.ts): the grid columns and rows are set from the client count. */
      #views { position: fixed; inset: 0; display: grid; }
      #views canvas { width: 100%; height: 100%; min-width: 0; min-height: 0; display: block; }
      #hud { position: fixed; inset: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <main id="views"></main>
    <div id="hud"></div>
    <script type="module" src="/src/play/main.ts"></script>
  </body>
</html>
