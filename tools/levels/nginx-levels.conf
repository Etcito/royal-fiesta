# Inside the `server { server_name assets.etcito.com; ... }` block (port 443), before `location /`.
# The service sets Access-Control-Allow-Origin and Cross-Origin-Resource-Policy itself: no add_header here.
    location /levels {
        client_max_body_size 5m;
        proxy_pass http://127.0.0.1:9790;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
